# Install only after issuing the manga.yeuxark.com certificate.
# $uri excludes query strings containing temporary manga image tickets.
log_format sardina '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';
limit_conn_zone $server_name zone=sardina_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name manga.yeuxark.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sardina-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://manga.yeuxark.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manga.yeuxark.com;
    ssl_certificate /etc/letsencrypt/live/manga.yeuxark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manga.yeuxark.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/sardina-access.log sardina;
    error_log /var/log/nginx/sardina-error.log warn;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn sardina_connections 64;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sardina-acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }
}
